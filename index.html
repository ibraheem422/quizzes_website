<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quizzes</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  :root {
    --bg: #f0f4f8; --card: #ffffff; --text: #2d3436; --muted: #636e72;
    --border: #dfe6e9; --primary: #6c5ce7; --primary-hover: #5a4bd1;
    --success: #00b894; --danger: #d63031; --warning: #fdcb6e;
  }
  body { background: var(--bg); color: var(--text); min-height: 100vh; }

  /* Auth */
  .auth-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1rem; background: linear-gradient(135deg, #667eea, #764ba2); }
  .auth-card { background:white; padding:2.5rem; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,0.2); width:100%; max-width:400px; }
  .auth-card h1 { text-align:center; font-size:2rem; margin-bottom:0.3rem; background:linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .auth-card .subtitle { text-align:center; color:var(--muted); margin-bottom:1.5rem; font-size:0.9rem; }
  .auth-tabs { display:flex; gap:0.4rem; margin-bottom:1.5rem; background:#f1f2f6; padding:0.3rem; border-radius:10px; }
  .auth-tab { flex:1; padding:0.6rem; text-align:center; border-radius:8px; cursor:pointer; font-weight:600; color:var(--muted); transition:all 0.2s; user-select:none; }
  .auth-tab.active { background:white; color:var(--primary); box-shadow:0 2px 8px rgba(0,0,0,0.1); }
  .auth-form .form-group { margin-bottom:1rem; }
  .auth-form label { display:block; margin-bottom:0.3rem; font-size:0.85rem; font-weight:600; color:var(--muted); }
  .auth-form input { width:100%; padding:0.8rem 1rem; border:2px solid var(--border); border-radius:10px; font-size:1rem; transition:border 0.2s; }
  .auth-form input:focus { outline:none; border-color:var(--primary); }
  .auth-form button { width:100%; padding:0.9rem; background:var(--primary); color:white; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:all 0.2s; margin-top:0.5rem; }
  .auth-form button:hover { background:var(--primary-hover); transform:translateY(-1px); }
  .auth-error { color:var(--danger); font-size:0.85rem; margin-top:0.8rem; text-align:center; min-height:1em; }

  /* App */
  .app { display:none; }
  .app.visible { display:block; }
  header { background:white; border-bottom:1px solid var(--border); padding:1rem 2rem; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:10; flex-wrap:wrap; gap:0.75rem; }
  .logo { font-size:1.5rem; font-weight:700; background:linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip:text; -webkit-text-fill-color:transparent; cursor:pointer; }
  .user-area { display:flex; align-items:center; gap:0.75rem; flex-wrap:wrap; }
  .user-info { font-size:0.85rem; color:var(--muted); display:flex; align-items:center; gap:0.4rem; }
  .user-info strong { color:var(--text); max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .admin-badge { background:#ffd700; color:#5d4500; padding:0.2rem 0.6rem; border-radius:20px; font-size:0.7rem; font-weight:700; display:none; }

  main { max-width:1200px; margin:0 auto; padding:2rem; }
  .view { display:none; }
  .view.active { display:block; }

  .btn { padding:0.65rem 1.2rem; border:none; border-radius:10px; cursor:pointer; font-size:0.92rem; font-weight:600; transition:all 0.2s; background:#f1f2f6; color:var(--text); }
  .btn:hover { transform:translateY(-1px); }
  .btn.primary { background:var(--primary); color:white; }
  .btn.primary:hover { background:var(--primary-hover); }
  .btn.danger { background:var(--danger); color:white; }
  .btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

  /* Dashboard */
  .dashboard-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; flex-wrap:wrap; gap:0.5rem; }
  .dashboard-header h2 { font-size:1.6rem; }
  .quiz-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(290px, 1fr)); gap:1.25rem; }
  .quiz-card { background:white; border:2px solid var(--border); border-radius:16px; padding:1.5rem; transition:all 0.2s; cursor:pointer; }
  .quiz-card:hover { transform:translateY(-3px); box-shadow:0 10px 25px rgba(0,0,0,0.08); border-color:var(--primary); }
  .quiz-card-header { display:flex; justify-content:space-between; align-items:flex-start; gap:0.5rem; margin-bottom:0.4rem; }
  .quiz-card h3 { font-size:1.2rem; }
  .tpl-badge { font-size:0.7rem; padding:0.25rem 0.55rem; border-radius:20px; font-weight:600; white-space:nowrap; }
  .tpl-badge.tpl-quiz { background:#e0f7f5; color:#00897b; }
  .tpl-badge.tpl-scramble { background:#fff3e0; color:#e65100; }
  .tpl-badge.tpl-type { background:#ede7f6; color:#4527a0; }
  .tpl-badge.tpl-maze { background:#fce4ec; color:#c2185b; }
  .quiz-card p { color:var(--muted); font-size:0.9rem; margin-bottom:1rem; min-height:2.5em; }
  .quiz-meta { font-size:0.8rem; color:var(--muted); margin-bottom:1rem; }
  .quiz-actions { display:flex; gap:0.5rem; }
  .quiz-actions .btn { flex:1; padding:0.5rem 0.7rem; font-size:0.82rem; }
  .empty-state { text-align:center; padding:4rem 1rem; color:var(--muted); grid-column:1/-1; }
  .empty-state .icon { font-size:4rem; margin-bottom:1rem; }

  /* Create form */
  .form-group { margin-bottom:1.25rem; }
  .form-group label { display:block; margin-bottom:0.4rem; font-weight:600; color:var(--muted); font-size:0.9rem; }
  .form-group input, .form-group textarea { width:100%; padding:0.7rem; border:2px solid var(--border); border-radius:10px; font-size:0.95rem; font-family:inherit; }
  .form-group input:focus, .form-group textarea:focus { outline:none; border-color:var(--primary); }
  .question-block { background:#f8f9fc; border:2px solid var(--border); border-radius:12px; padding:1.25rem; margin-bottom:1rem; }
  .question-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
  .question-header span { font-weight:700; color:var(--primary); }
  .option-row { display:flex; align-items:center; gap:0.6rem; margin-bottom:0.5rem; }
  .option-row input[type="radio"] { width:auto; cursor:pointer; accent-color:var(--primary); transform:scale(1.2); }
  .option-row input[type="text"] { flex:1; padding:0.5rem; border:1px solid var(--border); border-radius:8px; }
  .form-actions { display:flex; gap:0.75rem; margin-top:1.5rem; }
  .form-actions .btn { flex:1; }

  /* Template picker */
  .template-picker { display:grid; grid-template-columns:repeat(4,1fr); gap:0.75rem; }
  .template-card { background:#f8f9fc; border:2px solid var(--border); border-radius:12px; padding:1rem 0.5rem; text-align:center; cursor:pointer; transition:all 0.15s; user-select:none; }
  .template-card:hover { border-color:var(--primary); }
  .template-card.selected { border-color:var(--primary); background:#f0f0ff; box-shadow:0 4px 12px rgba(108,92,231,0.15); }
  .template-card .icon { font-size:1.8rem; margin-bottom:0.3rem; }
  .template-card strong { display:block; font-size:0.88rem; margin-bottom:0.2rem; }
  .template-card small { color:var(--muted); font-size:0.72rem; }

  /* Game */
  .game-container { background:white; border-radius:20px; padding:1.5rem; min-height:500px; box-shadow:0 5px 20px rgba(0,0,0,0.05); }
  .game-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; padding-bottom:1rem; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:0.5rem; }
  .game-title { font-size:1.05rem; font-weight:700; }
  .game-score { background:var(--primary); color:white; padding:0.4rem 1rem; border-radius:20px; font-weight:600; font-size:0.9rem; }
  .progress-bar { background:#ecf0f1; height:10px; border-radius:5px; margin-bottom:1.5rem; overflow:hidden; }
  .progress-fill { background:linear-gradient(90deg, var(--primary), #a29bfe); height:100%; transition:width 0.3s; }
  .question-text { font-size:1.35rem; font-weight:600; margin-bottom:1.5rem; line-height:1.4; text-align:center; padding:1rem 0; }
  .options-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.8rem; max-width:650px; margin:0 auto; }
  .option-btn { background:#f8f9fc; border:3px solid var(--border); padding:1.1rem; border-radius:12px; cursor:pointer; font-size:1rem; text-align:left; transition:all 0.2s; font-weight:500; font-family:inherit; color:var(--text); }
  .option-btn:hover:not(:disabled) { border-color:var(--primary); background:#f0f0ff; }
  .option-btn.correct { border-color:var(--success); background:#d4f9e8; }
  .option-btn.wrong { border-color:var(--danger); background:#fde8e8; }
  .option-btn:disabled { cursor:default; }

  /* Word Scramble */
  .scramble-question { text-align:center; font-size:1.25rem; margin-bottom:1rem; padding:1rem; background:#f8f9fc; border-radius:12px; font-weight:600; }
  .scramble-hint { text-align:center; color:var(--muted); font-size:0.85rem; margin-bottom:1rem; }
  .scramble-answer { display:flex; flex-wrap:wrap; gap:0.4rem; justify-content:center; min-height:55px; padding:1rem; border:2px dashed var(--border); border-radius:10px; margin-bottom:1.5rem; align-items:center; transition:all 0.2s; }
  .scramble-answer .placeholder { color:#bbb; font-size:0.9rem; }
  .scramble-tile { background:var(--primary); color:white; min-width:40px; height:40px; padding:0 0.4rem; display:flex; align-items:center; justify-content:center; border-radius:8px; font-size:1.2rem; font-weight:700; cursor:pointer; transition:all 0.15s; user-select:none; }
  .scramble-tile:hover { transform:scale(1.05); }
  .scramble-tile.used { opacity:0.25; cursor:default; transform:none; }
  .scramble-pool { display:flex; flex-wrap:wrap; gap:0.4rem; justify-content:center; }
  .scramble-pool .scramble-tile { background:#f1f2f6; color:var(--text); }

  /* Type the Answer */
  .type-question { font-size:1.35rem; font-weight:600; margin-bottom:1.5rem; line-height:1.4; text-align:center; padding:1rem 0; }
  .type-input-wrap { display:flex; gap:0.5rem; max-width:500px; margin:0 auto; }
  .type-input-wrap input { flex:1; padding:0.9rem 1rem; border:2px solid var(--border); border-radius:10px; font-size:1rem; font-family:inherit; }
  .type-input-wrap input:focus { outline:none; border-color:var(--primary); }
  .type-input-wrap input:disabled { background:#f8f9fc; }
  #type-feedback { text-align:center; margin-top:1.5rem; min-height:2rem; }
  .type-correct { color:var(--success); font-size:1.2rem; font-weight:600; }
  .type-wrong { color:var(--danger); font-size:1.05rem; }
  .type-wrong strong { color:var(--text); }
  #scramble-feedback { text-align:center; margin-top:1rem; min-height:1.5rem; }

  /* ===== Maze Runner (different dark neon style) ===== */
  .maze-game {
    background: linear-gradient(135deg, #0f0f1e, #1a1a2e);
    border-radius: 12px;
    padding: 1.25rem;
    color: #e0e0e0;
    font-family: 'Courier New', monospace;
    margin-top: 1rem;
  }
  .maze-question {
    text-align: center;
    font-size: 1.05rem;
    margin-bottom: 1rem;
    padding: 0.8rem;
    background: #16213e;
    border-radius: 8px;
    color: #00ffc8;
    border: 1px solid #00ffc8;
    line-height: 1.4;
  }
  .maze-question strong { color: #fff; }
  .maze-grid {
    display: grid;
    gap: 3px;
    background: #16213e;
    padding: 8px;
    border-radius: 8px;
    margin: 0 auto;
    max-width: 480px;
    border: 1px solid #30475e;
  }
  .maze-cell {
    aspect-ratio: 1;
    background: #16213e;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    font-weight: 700;
    text-align: center;
    padding: 2px;
    position: relative;
    color: white;
    overflow: hidden;
    transition: all 0.15s;
  }
  .maze-cell.wall {
    background: #0f3460;
    box-shadow: inset 0 0 8px rgba(0,0,0,0.5);
  }
  .maze-cell.player {
    background: #00ffc8;
    color: #16213e;
    box-shadow: 0 0 18px #00ffc8;
    font-size: 1.2rem;
    animation: playerPulse 1s ease-in-out infinite;
  }
  @keyframes playerPulse { 0%,100%{box-shadow:0 0 15px #00ffc8;} 50%{box-shadow:0 0 25px #00ffc8;} }
  .maze-cell.option {
    background: #e94560;
    color: white;
    box-shadow: 0 0 8px rgba(233,69,96,0.5);
  }
  .maze-cell.option:hover { transform: scale(1.03); }
  .maze-cell.flash-correct {
    background: #00ffc8 !important;
    color: #16213e !important;
    box-shadow: 0 0 25px #00ffc8 !important;
  }
  .maze-cell.flash-wrong {
    background: #ff4444 !important;
    color: white !important;
    box-shadow: 0 0 20px #ff4444 !important;
  }
  .maze-dpad {
    display: grid;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    gap: 4px;
    margin: 1.25rem auto 0.5rem;
    width: max-content;
  }
  .maze-dpad button {
    background: #16213e;
    color: #00ffc8;
    border: 2px solid #00ffc8;
    border-radius: 8px;
    font-size: 1.5rem;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.1s;
  }
  .maze-dpad button:hover { background: #00ffc8; color: #16213e; }
  .maze-dpad button:active { transform: scale(0.95); }
  .maze-dpad .spacer { visibility: hidden; }
  .maze-help { text-align:center; color:#888; font-size:0.78rem; margin-top:0.5rem; font-family: 'Segoe UI', sans-serif; }

  /* Result */
  .result-card { text-align:center; padding:2rem 1rem; }
  .result-card .emoji { font-size:4rem; margin-bottom:1rem; }
  .result-card h2 { margin-bottom:0.5rem; }
  .result-card .score-big { font-size:3rem; font-weight:700; color:var(--primary); margin:1rem 0; }
  .result-card .label { color:var(--muted); margin-bottom:1.5rem; }
  .result-actions { display:flex; gap:0.75rem; justify-content:center; flex-wrap:wrap; }
  .confetti { position:fixed; width:10px; height:14px; pointer-events:none; z-index:9999; }

  @media (max-width:600px) {
    header { padding:1rem; }
    main { padding:1rem; }
    .quiz-grid { grid-template-columns:1fr; }
    .options-grid { grid-template-columns:1fr; }
    .template-picker { grid-template-columns:1fr 1fr; }
    .type-input-wrap { flex-direction:column; }
    .maze-grid { max-width: 100%; }
    .maze-cell { font-size: 0.6rem; }
  }
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <h1>Quizzes</h1>
    <p class="subtitle">Sign in or create an account to play</p>
    <div class="auth-tabs">
      <div class="auth-tab active" data-mode="login" onclick="setAuthMode('login')">Login</div>
      <div class="auth-tab" data-mode="signup" onclick="setAuthMode('signup')">Sign Up</div>
    </div>
    <form class="auth-form" id="auth-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="auth-email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="auth-password" placeholder="Your password" required>
      </div>
      <button type="submit" id="auth-submit">Login</button>
      <p class="auth-error" id="auth-error"></p>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app" class="app">
  <header>
    <div class="logo" onclick="showView('dashboard')">Quizzes</div>
    <div class="user-area">
      <div class="user-info">
        <span>👤</span>
        <strong id="user-email"></strong>
        <span id="admin-badge" class="admin-badge">ADMIN</span>
      </div>
      <button class="btn primary" id="create-btn" onclick="startCreate()">+ Create Quiz</button>
      <button class="btn" onclick="logout()">Logout</button>
    </div>
  </header>

  <main>
    <section id="dashboard-view" class="view active">
      <div class="dashboard-header"><h2>Quizzes</h2></div>
      <div class="quiz-grid" id="quiz-grid"></div>
    </section>

    <section id="create-view" class="view">
      <div class="dashboard-header">
        <h2 id="create-title">Create New Quiz</h2>
        <button class="btn" onclick="showView('dashboard')">&larr; Back</button>
      </div>
      <div class="form-group">
        <label>Quiz Title</label>
        <input type="text" id="quiz-title" placeholder="e.g. World Capitals">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="quiz-desc" placeholder="A short description of your quiz" rows="2"></textarea>
      </div>
      <div class="form-group">
        <label>Template (choose how this quiz will be played)</label>
        <div class="template-picker" id="template-picker">
          <div class="template-card selected" data-template="quiz" onclick="selectTemplate('quiz')">
            <div class="icon">❓</div><strong>Quiz</strong><small>Multiple choice</small>
          </div>
          <div class="template-card" data-template="scramble" onclick="selectTemplate('scramble')">
            <div class="icon">🔤</div><strong>Word Scramble</strong><small>Unscramble answer</small>
          </div>
          <div class="template-card" data-template="type" onclick="selectTemplate('type')">
            <div class="icon">⌨️</div><strong>Type the Answer</strong><small>Type your answer</small>
          </div>
          <div class="template-card" data-template="maze" onclick="selectTemplate('maze')">
            <div class="icon">🌀</div><strong>Maze Runner</strong><small>Navigate to the answer</small>
          </div>
        </div>
      </div>
      <div id="questions-container"></div>
      <button class="btn" onclick="addQuestionForTemplate(selectedTemplate)" style="margin-bottom:1rem;">+ Add Question</button>
      <div class="form-actions">
        <button class="btn" onclick="showView('dashboard')">Cancel</button>
        <button class="btn primary" onclick="saveQuiz()">Save Quiz</button>
      </div>
    </section>

    <section id="game-view" class="view">
      <div class="game-container">
        <div class="game-header">
          <span class="game-title" id="game-title">Quiz</span>
          <button class="btn" onclick="showView('dashboard')">&larr; Back</button>
        </div>
        <div id="game-body"></div>
      </div>
    </section>
  </main>
</div>

<script>
/* ===== CONFIG ===== */
const ADMIN_EMAIL = 'ibraheem.muhammad.ai@gmail.com';
const ADMIN_PASSWORD = 'Midea@222';

const USERS_KEY = 'quizzes_users';
const DATA_KEY = 'quizzes_app_data';
const SESSION_KEY = 'quizzes_session';

/* ===== TEMPLATES ===== */
const MODES = [
  { id: 'quiz',     icon: '❓', name: 'Quiz',            desc: 'Multiple choice' },
  { id: 'scramble', icon: '🔤', name: 'Word Scramble',   desc: 'Unscramble answer' },
  { id: 'type',     icon: '⌨️', name: 'Type the Answer', desc: 'Type your answer' },
  { id: 'maze',     icon: '🌀', name: 'Maze Runner',     desc: 'Navigate to the answer' }
];
function modeName(id) { return MODES.find(m => m.id === id)?.name || 'Quiz'; }

/* ===== STATE ===== */
let session = null;
let quizzes = [];
let editingId = null;
let currentQuizId = null;
let currentMode = null;
let selectedTemplate = 'quiz';
let gameState = {};

/* ===== STORAGE ===== */
function getUsers() { return JSON.parse(localStorage.getItem(USERS_KEY) || '[]'); }
function saveUsers(u) { localStorage.setItem(USERS_KEY, JSON.stringify(u)); }
function loadQuizzes() { quizzes = JSON.parse(localStorage.getItem(DATA_KEY) || '[]'); }
function saveQuizzesToStorage() { localStorage.setItem(DATA_KEY, JSON.stringify(quizzes)); }

/* ===== AUTH ===== */
function isAdmin(email, password) { return email === ADMIN_EMAIL && password === ADMIN_PASSWORD; }
function setAuthMode(mode) {
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
  document.getElementById('auth-submit').textContent = mode === 'login' ? 'Login' : 'Sign Up';
  document.getElementById('auth-error').textContent = '';
}
function handleAuth(e) {
  e.preventDefault();
  const email = document.getElementById('auth-email').value.trim().toLowerCase();
  const password = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  errEl.textContent = '';
  if (!email || !password) { errEl.textContent = 'Please fill in both fields.'; return; }
  if (isAdmin(email, password)) {
    session = { email: ADMIN_EMAIL, isAdmin: true };
    localStorage.setItem(SESSION_KEY, JSON.stringify(session));
    showApp(); return;
  }
  if (document.querySelector('.auth-tab.active').dataset.mode === 'signup') {
    if (email === ADMIN_EMAIL) { errEl.textContent = 'This email is reserved for the admin. Please log in directly.'; return; }
    const users = getUsers();
    if (users.find(u => u.email === email)) { errEl.textContent = 'An account with this email already exists. Please log in.'; return; }
    users.push({ email, password: btoa(password), createdAt: Date.now() });
    saveUsers(users);
    session = { email, isAdmin: false };
    localStorage.setItem(SESSION_KEY, JSON.stringify(session));
    showApp(); return;
  }
  const users = getUsers();
  const user = users.find(u => u.email === email && atob(u.password) === password);
  if (!user) { errEl.textContent = 'Invalid email or password.'; return; }
  session = { email: user.email, isAdmin: false };
  localStorage.setItem(SESSION_KEY, JSON.stringify(session));
  showApp();
}
function logout() {
  session = null; currentMode = null;
  localStorage.removeItem(SESSION_KEY);
  document.getElementById('app').classList.remove('visible');
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('auth-form').reset();
  setAuthMode('login');
}
function showApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  document.getElementById('user-email').textContent = session.email;
  document.getElementById('admin-badge').style.display = session.isAdmin ? 'inline-block' : 'none';

/* ===== VIEWS ===== */
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(name + '-view').classList.add('active');
  if (name === 'dashboard') { currentMode = null; renderDashboard(); }
}
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ===== DASHBOARD ===== */

}

/* ===== CREATE / EDIT / DELETE ===== */
function selectTemplate(t) {
  // Capture current questions before switching
  const currentQs = captureQuestionsFromDOM();
  selectedTemplate = t;
  document.querySelectorAll('.template-card').forEach(c => {
    c.classList.toggle('selected', c.dataset.template === t);
  });
  // Convert & re-render questions in new format
  const container = document.getElementById('questions-container');
  container.innerHTML = '';
  const converted = currentQs.map(q => convertQuestion(q, t));
  if (converted.length === 0) {
    addQuestionForTemplate(t);
  } else {
    converted.forEach(q => addQuestionForTemplate(t, q));
  }
}

function captureQuestionsFromDOM() {
  const blocks = document.querySelectorAll('#questions-container .question-block');
  const qs = [];
  for (const block of blocks) {
    const text = block.querySelector('.q-text')?.value.trim() || '';
    if (selectedTemplate === 'scramble') {
      const answerInput = block.querySelector('.q-answer');
      const answer = answerInput ? answerInput.value.trim() : '';
      qs.push({ text, answer });
    } else {
      const options = Array.from(block.querySelectorAll('.q-option')).map(o => o.value.trim());
      const correctRadio = block.querySelector('input[type="radio"]:checked');
      const correct = correctRadio ? parseInt(correctRadio.value) : 0;
      qs.push({ text, options, correct });
    }
  }
  return qs;
}

function convertQuestion(q, targetTemplate) {
  if (targetTemplate === 'scramble') {
    // Need { text, answer }
    let answer = q.answer || '';
    if (!answer && q.options && q.options.length > 0) {
      answer = q.options[q.correct] || q.options[0] || '';
    }
    return { text: q.text, answer };
  } else {
    // Need { text, options[4], correct }
    if (q.options && q.options.length >= 4) {
      return { text: q.text, options: q.options, correct: q.correct || 0 };
    } else if (q.answer) {
      return { text: q.text, options: [q.answer, '', '', ''], correct: 0 };
    } else {
      return { text: q.text, options: ['', '', '', ''], correct: 0 };
    }
  }
}

function addQuestionForTemplate(template, prefilled = null) {
  if (template === 'scramble') addScrambleQuestion(prefilled);
  else addQuestion(prefilled);
}

function startCreate() {
  if (!session.isAdmin) return;
  editingId = null;
  document.getElementById('create-title').textContent = 'Create New Quiz';
  document.getElementById('quiz-title').value = '';
  document.getElementById('quiz-desc').value = '';
  document.getElementById('questions-container').innerHTML = '';
  selectedTemplate = 'quiz';

}

function editQuiz(id) {
  if (!session.isAdmin) return;
  const q = quizzes.find(x => x.id === id);

  editingId = id;
  document.getElementById('create-title').textContent = 'Edit Quiz';

function deleteQuiz(id) {

  quizzes = quizzes.filter(q => q.id !== id);

    block.querySelectorAll('input[type="radio"]').forEach(r => r.name = `correct-${i}`);

function saveQuiz() {
  if (!session.isAdmin) return;
  const title = document.getElementById('quiz-title').value.trim();
  const description = document.getElementById('quiz-desc').value.trim();
  if (!title) { alert('Please enter a quiz title.'); return; }

  const blocks = document.querySelectorAll('#questions-container .question-block');
  const questions = [];

  if (selectedTemplate === 'scramble') {
    for (const block of blocks) {
      const text = block.querySelector('.q-text').value.trim();
      const answer = block.querySelector('.q-answer').value.trim();
      if (!text) { alert('Please fill in all question texts.'); return; }
      if (!answer) { alert('Please fill in the correct answer for every question.'); return; }
      questions.push({ text, answer });
    }
  } else {
    for (const block of blocks) {
      const text = block.querySelector('.q-text').value.trim();
      const options = Array.from(block.querySelectorAll('.q-option')).map(o => o.value.trim());
      const correctRadio = block.querySelector('input[type="radio"]:checked');
      if (!text) { alert('Please fill in all question texts.'); return; }
      if (options.some(o => !o)) { alert('Please fill in all options.'); return; }
      if (!correctRadio) { alert('Please select the correct answer for every question.'); return; }
      questions.push({ text, options, correct: parseInt(correctRadio.value) });
    }
  }
  if (questions.length === 0) { alert('Add at least one question.'); return; }

  if (editingId) {
    const i = quizzes.findIndex(q => q.id === editingId);
    if (i > -1) quizzes[i] = { ...quizzes[i], title, description, template: selectedTemplate, questions, updatedAt: Date.now() };
  } else {
    quizzes.push({ id: 'quiz_' + Date.now() + '_' + Math.random().toString(36).slice(2,8), title, description, template: selectedTemplate, questions, createdAt: Date.now() });
  }
  saveQuizzesToStorage();
  showView('dashboard');
}

/* ===== PLAY ===== */
function playQuiz(id) {
  const q = quizzes.find(x => x.id === id);
  if (!q) return;
  currentQuizId = id;
  const tpl = q.template || 'quiz';
  currentMode = tpl;
  document.getElementById('game-title').textContent = q.title + ' · ' + modeName(tpl);
  showView('game');
  if (tpl === 'scramble')      startScramble(q);
  else if (tpl === 'type')     startType(q);
  else if (tpl === 'maze')     startMaze(q);
  else                         startQuizMode(q);
}

/* ===== TEMPLATE 1: QUIZ ===== */
function startQuizMode(quiz) {

function quizAnswer(i) {

/* ===== TEMPLATE 2: WORD SCRAMBLE (with distractor letters) ===== */
function getScrambleAnswer(q) {
  if (q.answer) return q.answer;
  if (q.options && q.correct != null) return q.options[q.correct] || '';
  return '';
}
function startScramble(quiz) {
  gameState = { quiz, idx: 0, score: 0 };
  renderScramble();
}
function renderScramble() {
  const { quiz, idx, score } = gameState;
  const q = quiz.questions[idx];
  const answer = getScrambleAnswer(q);
  const answerLetters = answer.replace(/\s+/g, '').toUpperCase().split('');

  // Generate distractor letters (not in answer)
  const usedSet = new Set(answerLetters);
  const numDistractors = Math.max(3, Math.ceil(answerLetters.length / 2));
  const distractors = [];
  while (distractors.length < numDistractors) {
    const c = String.fromCharCode(65 + Math.floor(Math.random() * 26));
    if (!usedSet.has(c)) { distractors.push(c); usedSet.add(c); }
  }

  const allLetters = shuffle([...answerLetters, ...distractors]);
  gameState.allLetters = allLetters;
  gameState.targetAnswer = answerLetters.join('');
  gameState.used = allLetters.map(() => false);
  gameState.built = [];
  gameState.answered = false;

  document.getElementById('game-body').innerHTML = `
    <div class="progress-bar"><div class="progress-fill" style="width:${(idx/quiz.questions.length)*100}%"></div></div>
    <div style="display:flex;justify-content:space-between;margin-bottom:1rem;font-size:0.9rem;color:var(--muted);">
      <span>Word ${idx+1} / ${quiz.questions.length}</span><span class="game-score">Score: ${score}</span>
    </div>
    <div class="scramble-question">${escapeHtml(q.text)}</div>
    <div class="scramble-hint">Pick only the letters that spell the answer — wrong letters are mixed in!</div>
    <div class="scramble-answer" id="scramble-answer"></div>
    <div class="scramble-pool" id="scramble-pool">
      ${allLetters.map((l, i) => `<div class="scramble-tile" onclick="pickLetter(${i})" data-letter-idx="${i}">${l}</div>`).join('')}
    </div>
    <div style="text-align:center;margin-top:1.5rem;display:flex;gap:0.5rem;justify-content:center;">
      <button class="btn" onclick="clearScramble()">Clear</button>
      <button class="btn primary" onclick="checkScramble()">Check</button>
    </div>
    <div id="scramble-feedback"></div>
  `;
  renderScrambleBuilt();
}
function renderScrambleBuilt() {
  const ans = document.getElementById('scramble-answer');
  ans.innerHTML = gameState.built.length
    ? gameState.built.map((l, i) => `<div class="scramble-tile" onclick="unpickLetter(${i})">${l}</div>`).join('')
    : '<span class="placeholder">Tap letters below to build the answer</span>';
  document.querySelectorAll('#scramble-pool .scramble-tile').forEach((tile, i) => {
    tile.classList.toggle('used', gameState.used[i]);
  });
}
function pickLetter(i) {
  if (gameState.used[i] || gameState.answered) return;
  gameState.used[i] = true;
  gameState.built.push(gameState.allLetters[i]);
  renderScrambleBuilt();
}
function unpickLetter(builtIdx) {
  if (gameState.answered) return;
  const letter = gameState.built[builtIdx];
  for (let i = 0; i < gameState.allLetters.length; i++) {
    if (gameState.allLetters[i] === letter && gameState.used[i]) { gameState.used[i] = false; break; }
  }
  gameState.built.splice(builtIdx, 1);
  renderScrambleBuilt();
}
function clearScramble() {
  if (gameState.answered) return;
  gameState.used = gameState.allLetters.map(() => false);
  gameState.built = [];
  renderScrambleBuilt();
}
function checkScramble() {
  if (gameState.answered) return;
  if (gameState.built.length === 0) return;
  gameState.answered = true;
  const { targetAnswer, built } = gameState;
  const guess = built.join('');
  const correct = guess === targetAnswer;
  if (correct) gameState.score++;
  const ans = document.getElementById('scramble-answer');
  const fb = document.getElementById('scramble-feedback');
  ans.style.background = correct ? '#d4f9e8' : '#fde8e8';
  ans.style.borderColor = correct ? '#00b894' : '#d63031';
  fb.innerHTML = correct
    ? `<span class="type-correct">✓ Correct!</span>`
    : `<span class="type-wrong">✗ The answer was: <strong>${escapeHtml(targetAnswer)}</strong></span>`;
  setTimeout(() => {
    gameState.idx++;
    gameState.answered = false;
    if (gameState.idx < gameState.quiz.questions.length) renderScramble();
    else showResult(gameState.quiz);
  }, 1900);
}

/* ===== TEMPLATE 3: TYPE THE ANSWER ===== */
function startType(quiz) {
  gameState = { quiz, idx: 0, score: 0 };
  renderType();
}
function renderType() {
  const { quiz, idx, score } = gameState;
  const q = quiz.questions[idx];
  document.getElementById('game-body').innerHTML = `
    <div class="progress-bar"><div class="progress-fill" style="width:${(idx/quiz.questions.length)*100}%"></div></div>
    <div style="display:flex;justify-content:space-between;margin-bottom:1rem;font-size:0.9rem;color:var(--muted);">
      <span>Question ${idx+1} / ${quiz.questions.length}</span><span class="game-score">Score: ${score}</span>
    </div>
    <div class="type-question">${escapeHtml(q.text)}</div>

      <input type="text" id="type-input" placeholder="Type your answer here..." autocomplete="off">

    <div id="type-feedback"></div>
  `;
  const input = document.getElementById('type-input');
  input.focus();
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkType(); });
}
function checkType() {
  if (gameState.answered) return;
  const input = document.getElementById('type-input');
  const guess = input.value.trim();
  if (!guess) return;
  gameState.answered = true;
  const { quiz, idx } = gameState;
  const q = quiz.questions[idx];
  const normalize = (s) => s.trim().toLowerCase().replace(/\s+/g, ' ');
  const correct = normalize(guess) === normalize(q.options[q.correct]);
  if (correct) gameState.score++;
  input.disabled = true;
  document.getElementById('type-feedback').innerHTML = correct
    ? `<div class="type-correct">✓ Correct!</div>`
    : `<div class="type-wrong">✗ The correct answer was: <strong>${escapeHtml(q.options[q.correct])}</strong></div>`;
  setTimeout(() => {
    gameState.idx++;
    gameState.answered = false;
    if (gameState.idx < quiz.questions.length) renderType();
    else showResult(quiz);
  }, 2000);
}

/* ===== TEMPLATE 4: MAZE RUNNER (dark neon style) ===== */
function startMaze(quiz) {
  gameState = { quiz, idx: 0, score: 0, gridSize: 6 };
  renderMaze();
}
function renderMaze() {
  const { quiz, idx, score, gridSize } = gameState;
  const q = quiz.questions[idx];
  const total = quiz.questions.length;

  let grid;
  let attempts = 0;
  do {
    grid = generateMazeGrid(gridSize, q);
    attempts++;
  } while (!isMazeReachable(grid, gridSize) && attempts < 10);
  gameState.grid = grid;
  gameState.playerPos = { r: Math.floor(gridSize/2), c: Math.floor(gridSize/2) };
  gameState.answered = false;
  grid[gameState.playerPos.r][gameState.playerPos.c].player = true;

  document.getElementById('game-body').innerHTML = `
    <div class="progress-bar"><div class="progress-fill" style="width:${(idx/total)*100}%"></div></div>
    <div style="display:flex;justify-content:space-between;margin-bottom:1rem;font-size:0.9rem;color:var(--muted);">
      <span>Question ${idx+1} / ${total}</span><span class="game-score">Score: ${score}</span>
    </div>
    <div class="maze-game">
      <div class="maze-question">Find the answer to: <strong>${escapeHtml(q.text)}</strong></div>
      <div class="maze-grid" id="maze-grid" style="grid-template-columns:repeat(${gridSize},1fr);"></div>
      <div class="maze-dpad">
        <div class="spacer"></div>
        <button onclick="movePlayer(-1,0)">↑</button>
        <div class="spacer"></div>
        <button onclick="movePlayer(0,-1)">←</button>
        <div class="spacer"></div>
        <button onclick="movePlayer(0,1)">→</button>
        <div class="spacer"></div>
        <button onclick="movePlayer(1,0)">↓</button>
        <div class="spacer"></div>
      </div>
      <p class="maze-help">Use arrow keys / WASD or the dpad. Step on the colored tile with the correct answer. Wrong tiles cost 1 point.</p>
    </div>
  `;
  drawMazeGrid();
}
function generateMazeGrid(size, q) {
  const grid = [];
  for (let r = 0; r < size; r++) {
    grid[r] = [];
    for (let c = 0; c < size; c++) {
      grid[r][c] = { wall: false, option: null, player: false };
    }
  }
  // Add some walls (not in center)
  const center = Math.floor(size/2);
  const numWalls = Math.max(3, Math.floor(size * size * 0.12));
  let placed = 0, tries = 0;
  while (placed < numWalls && tries < 100) {
    tries++;
    const r = Math.floor(Math.random() * size);
    const c = Math.floor(Math.random() * size);
    if (r === center && c === center) continue;
    if (grid[r][c].wall) continue;
    grid[r][c].wall = true;
    placed++;
  }
  // Place 4 options on empty non-center cells
  const positions = [];
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      if (!grid[r][c].wall && !(r === center && c === center)) {
        positions.push({r, c});
      }
    }
  }
  shuffle(positions);
  for (let i = 0; i < 4 && i < positions.length; i++) {
    const {r, c} = positions[i];
    grid[r][c].option = { text: q.options[i], isCorrect: i === q.correct };
  }
  return grid;
}
function isMazeReachable(grid, size) {
  const center = Math.floor(size/2);
  const visited = Array.from({length: size}, () => Array(size).fill(false));
  const queue = [{r: center, c: center}];
  visited[center][center] = true;
  while (queue.length) {
    const {r, c} = queue.shift();
    for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
      const nr = r + dr, nc = c + dc;
      if (nr < 0 || nr >= size || nc < 0 || nc >= size) continue;
      if (visited[nr][nc] || grid[nr][nc].wall) continue;
      visited[nr][nc] = true;
      queue.push({r: nr, c: nc});
    }
  }
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      if (grid[r][c].option && !visited[r][c]) return false;
    }
  }
  return true;
}
function drawMazeGrid() {
  const { grid, playerPos } = gameState;
  const size = grid.length;
  const gridEl = document.getElementById('maze-grid');
  if (!gridEl) return;
  let html = '';
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      const cell = grid[r][c];
      let cls = 'maze-cell';
      let content = '';
      if (cell.wall) {
        cls += ' wall';
      } else if (playerPos.r === r && playerPos.c === c) {
        cls += ' player';
        content = '●';
      } else if (cell.option) {
        cls += ' option';
        const t = cell.option.text;
        content = t.length > 10 ? t.slice(0,10) + '…' : t;
      }
      html += `<div class="${cls}">${escapeHtml(content)}</div>`;
    }
  }
  gridEl.innerHTML = html;
}
function movePlayer(dr, dc) {
  if (gameState.answered) return;
  if (!gameState.grid) return;
  const { grid, playerPos } = gameState;
  const size = grid.length;
  const nr = playerPos.r + dr;
  const nc = playerPos.c + dc;
  if (nr < 0 || nr >= size || nc < 0 || nc >= size) return;
  if (grid[nr][nc].wall) return;

  const target = grid[nr][nc];
  if (target.option) {
    if (target.option.isCorrect) {
      gameState.answered = true;
      gameState.score++;
      flashMazeCell(nr, nc, 'correct');
      updateMazeScore();
      setTimeout(() => {
        gameState.idx++;
        if (gameState.idx < gameState.quiz.questions.length) renderMaze();
        else showResult(gameState.quiz);
      }, 1200);
    } else {
      gameState.score = Math.max(0, gameState.score - 1);
      gameState.answered = true;
      flashMazeCell(nr, nc, 'wrong');
      updateMazeScore();
      setTimeout(() => {
        grid[nr][nc].option = null;
        grid[playerPos.r][playerPos.c].player = false;
        playerPos.r = nr; playerPos.c = nc;
        grid[nr][nc].player = true;
        gameState.answered = false;
        drawMazeGrid();
      }, 700);
    }
    return;
  }
  grid[playerPos.r][playerPos.c].player = false;
  playerPos.r = nr; playerPos.c = nc;
  grid[nr][nc].player = true;
  drawMazeGrid();
}
function flashMazeCell(r, c, type) {
  drawMazeGrid();
  const cells = document.querySelectorAll('#maze-grid .maze-cell');
  const size = gameState.grid.length;
  const idx = r * size + c;
  if (cells[idx]) {
    cells[idx].classList.add(type === 'correct' ? 'flash-correct' : 'flash-wrong');
    cells[idx].innerHTML = type === 'correct' ? '✓' : '✗';
  }
}
function updateMazeScore() {
  const el = document.querySelector('.game-score');
  if (el) el.textContent = 'Score: ' + gameState.score;
}

/* Keyboard controls for maze */
document.addEventListener('keydown', (e) => {
  if (currentMode !== 'maze') return;
  if (!gameState.grid) return;
  if (!document.getElementById('game-view').classList.contains('active')) return;
  let dr = 0, dc = 0;
  const k = e.key.toLowerCase();
  if (e.key === 'ArrowUp' || k === 'w') dr = -1;
  else if (e.key === 'ArrowDown' || k === 's') dr = 1;
  else if (e.key === 'ArrowLeft' || k === 'a') dc = -1;
  else if (e.key === 'ArrowRight' || k === 'd') dc = 1;
  else return;
  e.preventDefault();
  movePlayer(dr, dc);
});

/* ===== RESULT ===== */
function showResult(quiz) {
  const score = gameState.score || 0;
  const total = quiz.questions.length;
  const pct = Math.round((score / total) * 100);
  const emoji = pct === 100 ? '🏆' : pct >= 70 ? '🎉' : pct >= 40 ? '🙂' : '📚';
  const msg = pct === 100 ? 'Perfect!' : pct >= 70 ? 'Great Job!' : pct >= 40 ? 'Good Effort!' : 'Keep Practicing!';
  document.getElementById('game-body').innerHTML = `
    <div class="result-card">
      <div class="emoji">${emoji}</div>
      <h2>${msg}</h2>
      <div class="score-big">${score} / ${total}</div>
      <div class="label">${pct}% correct</div>
      <div class="result-actions">
        <button class="btn primary" onclick="playQuiz('${quiz.id}')">Play Again</button>
        <button class="btn" onclick="showView('dashboard')">Dashboard</button>
      </div>
    </div>
  `;
  if (pct >= 70) fireConfetti();
}

/* ===== CONFETTI ===== */
function fireConfetti() {
  const colors = ['#FF6B6B','#4ECDC4','#FFE66D','#A29BFE','#FF9F43','#55EFC4'];
  for (let i = 0; i < 80; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.left = Math.random() * 100 + 'vw';
    c.style.top = '-15px';
    const dx = (Math.random() - 0.5) * 250;
    const dur = 2 + Math.random() * 2;
    c.style.transition = `transform ${dur}s linear, opacity ${dur}s`;
    document.body.appendChild(c);
    setTimeout(() => {
      c.style.transform = `translate(${dx}px, 110vh) rotate(${Math.random()*720}deg)`;
      c.style.opacity = '0';
    }, 10);
    setTimeout(() => c.remove(), dur * 1000 + 200);
  }
}

/* ===== INIT ===== */
window.addEventListener('DOMContentLoaded', () => {
  const s = localStorage.getItem(SESSION_KEY);
  if (s) { try { session = JSON.parse(s); } catch(e) { session = null; } }
  if (session) showApp();
  else document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('auth-form').addEventListener('submit', handleAuth);
});
</script>
